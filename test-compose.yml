services:
  spring:
    image: 192.168.56.5:5050/demo/spring-thymeleaf-template:latest
    container_name: spring
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
