stages:
  - build

build:
  services:
    - docker:29.4.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  stage: build
  before_script:
    - mkdir -p "/etc/docker/certs.d/$CI_SERVER_HOST:5050"
    - cp "$CI_SERVER_TLS_CA_FILE"
      "/etc/docker/certs.d/$CI_SERVER_HOST:5050/ca.crt"
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u
      "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker info
    # - docker build -t "$CI_REGISTRY_IMAGE" .
    # - docker push "$CI_REGISTRY_IMAGE"
