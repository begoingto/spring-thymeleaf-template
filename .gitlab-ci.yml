stages:
  - build

build:
  services:
    - docker:29.4.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  stage: build
  before_script:
    - apk update && apk add --no-cache curl
    - curl -v --cacert "${CI_SERVER_TLS_CA_FILE}" $CI_PIPELINE_URL
  script:
