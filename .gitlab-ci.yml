stages:
  - test

test-job:
  image: docker:29.4.1-cli
  services:
    - docker:29.4.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  stage: test
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u
      "$CI_REGISTRY_USER" --password-stdin
  script:
    - echo "Running tests..."
    - docker info
